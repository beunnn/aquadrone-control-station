# mavlink-router hub config, installed as /etc/mavlink-router/main.conf by hub/setup_mavlink_router.sh.
# A UDP "Server" endpoint remembers only the last client that sent to it, so every device gets its own port.

[General]
TcpServerPort = 5760

[UartEndpoint fc]
Device = /dev/serial/by-id/usb-ArduPilot_CUAV-X7_330027000C51333037343333-if00
Baud = 115200

# Dev PC GCS (ArduDeck / Mission Planner)
[UdpEndpoint devpc]
Mode = Normal
Address = 192.168.2.100
Port = 14550

# Control box (Waveshare ESP32-P4)
[UdpEndpoint ctrlbox]
Mode = Server
Address = 0.0.0.0
Port = 14560

# Tab5 selector
[UdpEndpoint tab5]
Mode = Server
Address = 0.0.0.0
Port = 14561

# Test tools on the dev PC (tools/fake_vehicles.py, scripts)
[UdpEndpoint tools]
Mode = Server
Address = 0.0.0.0
Port = 14562

